<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Vumètre LED</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050506;color:#bbb;font:13px system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  body.idle{cursor:none}
  canvas{display:block;border-radius:6px}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .bar{position:fixed;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:8px calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left));transition:opacity .4s;z-index:5}
  #top{top:0;background:linear-gradient(#000c,#0000)}
  #bottom{bottom:0;background:linear-gradient(#0000,#000c);flex-direction:column;gap:4px}
  body.idle .bar,body.idle #list{opacity:0;pointer-events:none}
  .row{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
  button,select{background:#1b1b1fcc;color:#ddd;border:1px solid #3a3a40;border-radius:8px;padding:6px 9px;font:inherit;cursor:pointer}
  button:active{background:#333}
  button.on{border-color:#c9a24a;color:#e9c46a}
  input[type=range]{accent-color:#c9a24a;vertical-align:middle}
  label{display:flex;align-items:center;gap:5px;white-space:nowrap}
  #seek{flex:1;max-width:560px;min-width:120px}
  #title{max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #list{position:fixed;right:0;top:48px;bottom:84px;width:min(380px,82vw);flex-direction:column;background:#0b0b0df0;border-left:1px solid #2a2a2e;display:none;z-index:4;transition:opacity .4s}
  #list.open{display:flex}
  body.setopen #bottom,body.setopen #list{opacity:0;pointer-events:none}
  #items{flex:1;overflow:auto}
  #listFoot{padding:8px;border-top:1px solid #2a2a2e;text-align:center}
  .item{padding:9px 12px;border-bottom:1px solid #1a1a1d;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item.cur{color:#e9c46a;background:#1a1810}
  #toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:#000d;border:1px solid #333;border-radius:8px;padding:6px 12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
  #toast.show{opacity:1}
  #infoBox{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
  #infoBar{display:flex;gap:8px;justify-content:flex-end;padding:8px calc(8px + env(safe-area-inset-right)) 8px 8px}
  #info{flex:1;overflow:auto;margin:0;padding:10px;font:11px/1.4 ui-monospace,monospace;color:#cfc;white-space:pre-wrap;word-break:break-all;user-select:text}
  #settings{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:1fr 1fr;gap:6px 28px;padding:12px calc(18px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));background:#000b;border-top:1px solid #3a3a40}
  #settings .set{min-width:0}
  #settings .shead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:#ddd}
  #settings .sval{color:#e9c46a;font-variant-numeric:tabular-nums}
  #settings .sbtns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:2px}
  #settings .sbtns button{padding:10px 14px;font-size:14px}
  #settings input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;margin:0;background:transparent}
  #settings input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,#c9a24a var(--p,50%),#3a3a40 var(--p,50%))}
  #settings input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:#e9c46a;border:2px solid #000}
  #settings input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#3a3a40}
  #settings input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:#c9a24a}
  #settings input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#e9c46a;border:2px solid #000}
  @media (max-width:560px){#settings{grid-template-columns:1fr}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="bar">
  <button id="bUpdate" hidden>⟳ Mettre à jour</button>
  <button id="bDir">📁 Dossier</button>
  <button id="bFiles">🎵 Fichiers</button>
  <button id="bResume" hidden>↻ Reprendre</button>
  <select id="pal"></select>
  <button id="bSet">⚙</button>
  <button id="bFull">⛶</button>
</div>

<div id="bottom" class="bar">
  <div class="row"><span id="title">Démo : choisis une source</span><span id="time"></span></div>
  <div class="row">
    <input id="seek" type="range" min="0" max="1000" value="0">
  </div>
  <div class="row">
    <button id="bPrev">⏮</button>
    <button id="bPlay">▶</button>
    <button id="bNext">⏭</button>
    <button id="bShuf">🔀</button>
    <button id="bList">☰</button>
  </div>
</div>

<div id="list">
  <div id="items"></div>
  <div id="listFoot" hidden><button id="bClear">🗑 Vider la playlist</button></div>
</div>
<div id="settings" hidden>
  <div class="set">
    <div class="shead"><span>☀ Luminosité</span><span id="briVal" class="sval"></span></div>
    <input id="bri" type="range" min="0.2" max="1" step="0.05" value="0.8">
  </div>
  <div class="set">
    <div class="shead"><span>◢ Sensibilité</span><span id="sensVal" class="sval"></span></div>
    <input id="sens" type="range" min="0.5" max="2" step="0.05" value="1">
  </div>
  <div class="sbtns">
    <button id="bMic">🎤 Micro</button>
    <button id="bSys">🖥 Audio système</button>
    <button id="bReset">↺ Réinitialiser</button>
    <button id="bInfo">ℹ Infos</button>
  </div>
</div>
<div id="toast"></div>
<div id="infoBox" hidden>
  <div id="infoBar"><button id="infoCopy">Copier</button><button id="infoClose">✕ Fermer</button></div>
  <pre id="info"></pre>
</div>
<audio id="player" preload="auto"></audio>
<input id="fileIn" type="file" accept=".mp3,.flac,.m4a,.wav,.ogg,.oga,.opus,.aac" multiple hidden>

<script>
// ---- Réglages de la matrice ----
const COLS = 24, ROWS = 8;

const $ = id => document.getElementById(id);
const VERSION = '2026-11-20-i';

// ---- Journal (affiché par le bouton ℹ) ----
const LOG = [];
function log(...a) {
  LOG.push(new Date().toLocaleTimeString() + ' ' + a.map(x => String(x)).join(' '));
  if (LOG.length > 60) LOG.shift();
}
for (const k of ['warn', 'error']) { const o = console[k]; console[k] = (...a) => { log(k.toUpperCase(), ...a); o.apply(console, a); }; }
addEventListener('error', e => log('ERR', e.message, (e.filename || '').split('/').pop() + ':' + e.lineno));
addEventListener('unhandledrejection', e => log('REJ', e.reason && (e.reason.name + ': ' + e.reason.message)));
const AUDIO_RE = /\.(mp3|flac|ogg|oga|opus|m4a|aac|wav|weba)$/i;
const AUDIO_EXT = ['.mp3', '.flac', '.ogg', '.oga', '.opus', '.m4a', '.aac', '.wav', '.weba'];
const store = {
  get: (k, d) => { try { return localStorage.getItem('vu_' + k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('vu_' + k, v); } catch {} },
};

// ---- Utilitaires UI ----
let toastT;
function say(msg, ms = 3500) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}
let idleT;
function poke() {
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add('idle'), 5000);
}
['pointerdown', 'pointermove', 'keydown'].forEach(e => addEventListener(e, poke, { passive: true }));
poke();

// ---- Palettes : t (0 bas .. 1 haut) -> [h, s, l] ----
const PALETTES = {
  "Arc-en-ciel":  t => [220 - 220 * t, 100, 55],
  "Bleu / rose":  t => [225 + 120 * t, 95, 58],
  "Violet néon":  t => [285 + 25 * t, 100, 52 + 10 * t],
  "Braise":       t => [50 - 50 * t, 100, 52],
  "Vert → rouge": t => [130 - 130 * t, 100, 50],
};
const palSel = $('pal');
for (const k in PALETTES) palSel.add(new Option(k, k));
if (PALETTES[store.get('pal')]) palSel.value = store.get('pal');
palSel.onchange = () => store.set('pal', palSel.value);
// Curseurs de réglage : valeur affichée, mémorisée, et fonction de remise par défaut
const fmtBri = v => Math.round(v * 100) + ' %';
const fmtSens = v => '×' + Number(v).toFixed(2).replace('.', ',');
function bindSlider(id, key, def, valId, fmt) {
  const el = $(id), out = $(valId);
  const sync = () => {
    out.textContent = fmt(el.value);
    el.style.setProperty('--p', (el.value - el.min) / (el.max - el.min) * 100 + '%');
  };
  el.value = store.get(key, def); sync();
  el.oninput = () => { store.set(key, el.value); sync(); };
  return () => { el.value = def; store.set(key, def); sync(); };
}
const resetBri = bindSlider('bri', 'bri', 0.8, 'briVal', fmtBri);
const resetSens = bindSlider('sens', 'sens', 1, 'sensVal', fmtSens);
const pal = t => PALETTES[palSel.value](Math.min(1, Math.max(0, t)));
const hsl = (c, a = 1) => `hsla(${c[0]},${c[1]}%,${c[2]}%,${a})`;

// ---- Canvas ----
const cv = $('c'), ctx = cv.getContext('2d');
const led = document.createElement('canvas'), g = led.getContext('2d');
const glowA = document.createElement('canvas'), ga = glowA.getContext('2d');
const glowB = document.createElement('canvas'), gb = glowB.getContext('2d');
let pitch = 1, W = 1, H = 1;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.min(innerWidth * .97, innerHeight * .9 * COLS / ROWS);
  pitch = W / COLS; H = pitch * ROWS;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = led.width = Math.round(W * dpr);
  cv.height = led.height = Math.round(H * dpr);
  glowA.width = Math.max(8, cv.width / 6 | 0); glowA.height = Math.max(4, cv.height / 6 | 0);
  glowB.width = Math.max(4, cv.width / 16 | 0); glowB.height = Math.max(2, cv.height / 16 | 0);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

function cell(x, y, row, a) {
  const s = pitch * .78, r = s * .14;
  const px = x + (pitch - s) / 2, py = y + (pitch - s) / 2;
  const t = row / (ROWS - 1), d = .9 / ROWS;
  const lg = g.createLinearGradient(px, py, px + s * .35, py + s);
  lg.addColorStop(0, hsl(pal(t + d), a));
  lg.addColorStop(1, hsl(pal(t - d), a));
  g.fillStyle = lg;
  g.beginPath(); g.roundRect(px, py, s, s, r); g.fill();
  const rg = g.createRadialGradient(px + s * .5, py + s * .45, 0, px + s * .5, py + s * .5, s * .6);
  rg.addColorStop(0, `rgba(255,255,255,${.28 * a})`);
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fill();
}

// ---- Audio ----
const player = $('player');
let actx, analyser, outGain, data, liveSrc, liveStream, mode = 'demo';
async function initAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser();
    analyser.fftSize = 4096; analyser.smoothingTimeConstant = .55;
    analyser.minDecibels = -95; analyser.maxDecibels = -20;
    data = new Float32Array(analyser.frequencyBinCount);
    outGain = actx.createGain();
    actx.createMediaElementSource(player).connect(analyser);
    analyser.connect(outGain); outGain.connect(actx.destination);
  }
  if (actx.state === 'suspended') await actx.resume();
}
function stopLive() {
  try { liveSrc && liveSrc.disconnect(); } catch {}
  liveStream && liveStream.getTracks().forEach(t => t.stop());
  liveSrc = liveStream = null;
}
async function startLive(getter, label) {
  await initAudio();
  try {
    const st = await getter();
    if (!st.getAudioTracks().length) {
      st.getTracks().forEach(t => t.stop());
      say("Aucune piste audio : coche « Partager l'audio »."); return;
    }
    stopLive(); player.pause();
    liveStream = st;
    liveSrc = actx.createMediaStreamSource(new MediaStream(st.getAudioTracks()));
    liveSrc.connect(analyser);
    outGain.gain.value = 0;               // pas de retour dans les enceintes (larsen)
    mode = 'live'; say(label);
    $('title').textContent = label; $('time').textContent = '';
  } catch (e) { console.warn(e); say('Accès refusé ou indisponible'); }
}
$('bMic').onclick = () => startLive(() => navigator.mediaDevices.getUserMedia({
  audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }), 'Micro');
if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) $('bSys').hidden = true;
$('bSys').onclick = () => startLive(() => navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }), 'Audio système');

function bands() {
  const out = new Float32Array(COLS), nyq = actx.sampleRate / 2, n = data.length;
  analyser.getFloatFrequencyData(data);
  const sens = +$('sens').value;
  for (let i = 0; i < COLS; i++) {
    const f0 = 40 * Math.pow(400, i / COLS), f1 = 40 * Math.pow(400, (i + 1) / COLS);
    const b0 = Math.floor(f0 / nyq * n), b1 = Math.max(b0 + 1, Math.ceil(f1 / nyq * n));
    let m = -200;
    for (let b = b0; b < b1; b++) if (data[b] > m) m = data[b];
    let v = (m + 88) / 58 + (i / COLS) * .18;
    out[i] = Math.min(1, Math.max(0, v * sens));
  }
  return out;
}
function demo(t) {
  const out = new Float32Array(COLS);
  for (let i = 0; i < COLS; i++)
    out[i] = Math.max(0, .5 + .35 * Math.sin(t * 1.7 + i * .6) * Math.sin(t * .6 + i * .2) + .2 * Math.sin(t * 4.1 + i * 1.3)) * (1 - i / COLS * .45);
  return out;
}

// ---- Rendu ----
const level = new Float32Array(COLS), peak = new Float32Array(COLS), hold = new Float32Array(COLS);
function frame(ms) {
  const tgt = mode === 'live' ? bands() : demo(ms / 1000);
  for (let i = 0; i < COLS; i++) {
    level[i] = tgt[i] > level[i] ? tgt[i] : Math.max(tgt[i], level[i] - .045);
    if (level[i] >= peak[i]) { peak[i] = level[i]; hold[i] = 22; }
    else if (hold[i]-- < 0) peak[i] = Math.max(level[i], peak[i] - .012);
  }
  g.clearRect(0, 0, W, H);
  for (let c = 0; c < COLS; c++) {
    const v = level[c] * ROWS;
    for (let r = 0; r < ROWS; r++) {
      const a = Math.min(1, Math.max(0, v - r));
      if (a > .04) cell(c * pitch, (ROWS - 1 - r) * pitch, r, a);
    }
    const pr = Math.min(ROWS - 1, Math.floor(peak[c] * ROWS));
    if (pr > v && peak[c] > .05) cell(c * pitch, (ROWS - 1 - pr) * pitch, pr, .85);
  }
  // Lueur : copies réduites (flou bon marché), puis réagrandies en mode additif
  ga.imageSmoothingQuality = gb.imageSmoothingQuality = 'high';
  ga.clearRect(0, 0, glowA.width, glowA.height);
  ga.drawImage(led, 0, 0, glowA.width, glowA.height);
  gb.clearRect(0, 0, glowB.width, glowB.height);
  gb.drawImage(glowA, 0, 0, glowB.width, glowB.height);
  const bri = +$('bri').value;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#09090b'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.globalCompositeOperation = 'lighter';
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha = bri * .45; ctx.drawImage(glowB, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = bri * .6;  ctx.drawImage(glowA, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = bri;       ctx.drawImage(led, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- IndexedDB (handles de fichiers / dossier) ----
const DB = (() => {
  let p;
  const open = () => p ??= new Promise((res, rej) => {
    const r = indexedDB.open('vumetre', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open();
    return new Promise((res, rej) => { const q = fn(db.transaction('kv', mode).objectStore('kv'));
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)) };
})();

// ---- Bibliothèque ----
let lib = null, tracks = [], idx = -1, curUrl = null;
async function ensurePerm(h, ask) {
  const o = { mode: 'read' };
  try {
    if (h.queryPermission && (await h.queryPermission(o)) === 'granted') return true;
    if (ask && h.requestPermission) return (await h.requestPermission(o)) === 'granted';
  } catch (e) { console.warn(e); }
  return false;
}
async function scanDir(dir, out, path, depth = 0) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'file' && AUDIO_RE.test(name)) out.push({ name, path, get: () => h.getFile() });
    else if (h.kind === 'directory' && depth < 4) await scanDir(h, out, path + name + '/', depth + 1);
  }
}
let loadSeq = 0;   // un nouveau chargement ou « Vider » annule celui qui est en cours
async function loadLibrary(ask) {
  const seq = ++loadSeq, cur = lib;
  const hs = cur.type === 'dir' ? [cur.handle] : cur.handles;
  for (const h of hs) if (!(await ensurePerm(h, ask))) { log('bibliothèque: permission refusée'); return false; }
  const out = [];
  if (cur.type === 'dir') await scanDir(cur.handle, out, '');
  else for (const h of cur.handles) out.push({ name: h.name, path: '', get: () => h.getFile() });
  if (seq !== loadSeq) return null;   // annulé entre-temps
  out.sort((a, b) => (a.path + a.name).localeCompare(b.path + b.name, undefined, { numeric: true, sensitivity: 'base' }));
  tracks = out; idx = -1; renderList(); $('bResume').hidden = true;
  log('bibliothèque: ' + tracks.length + ' pistes');
  say(tracks.length + ' piste(s)');
  return true;
}
function syncClear() { $('listFoot').hidden = !(tracks.length || lib); }
async function clearLibrary() {
  loadSeq++;
  // On ne réinitialise pas l'élément audio (src vide + load()) : sur Android cela peut bloquer les lectures suivantes
  player.pause();
  try { player.currentTime = 0; } catch {}
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
  tracks = []; idx = -1; lib = null;
  try { await DB.set('lib', null); } catch (e) { console.warn(e); }
  if (!liveSrc) mode = 'demo';
  renderList(); $('bResume').hidden = true;
  $('seek').value = 0; $('time').textContent = ''; $('title').textContent = 'Playlist vidée';
  $('list').classList.remove('open');
  say('Playlist vidée');
}
$('bClear').onclick = clearLibrary;
async function setLibrary(l) {
  lib = l; syncClear();
  try { await DB.set('lib', l); } catch (e) { console.warn(e); say('Bibliothèque non mémorisable ici'); }
  return loadLibrary(true);
}
const isAbort = e => e && e.name === 'AbortError';

if (!('showDirectoryPicker' in window)) $('bDir').hidden = true;
$('bDir').onclick = async () => {
  const t0 = performance.now(), ms = () => Math.round(performance.now() - t0) + ' ms';
  try {
    reenter = !!document.fullscreenElement; log('dossier: sélecteur demandé');
    const h = await showDirectoryPicker({ mode: 'read' });
    log('dossier: choisi après ' + ms());
    if (await setLibrary({ type: 'dir', handle: h }) && tracks.length) play(0);
  } catch (e) {
    log('dossier: ' + (e && e.name) + ' après ' + ms() + ' : ' + (e && e.message));
    if (!isAbort(e)) { console.warn(e); say('Dossier impossible (' + (e && e.name) + ') : essaie « Fichiers »', 5000); }
    else if (performance.now() - t0 < 800) say("Le sélecteur s'est fermé aussitôt : essaie « Simple »", 5000);
  }
};
$('bFiles').onclick = async () => {
  const t0 = performance.now(), ms = () => Math.round(performance.now() - t0) + ' ms';
  reenter = !!document.fullscreenElement;
  log('fichiers: clic, showOpenFilePicker=' + ('showOpenFilePicker' in window));
  if ('showOpenFilePicker' in window) {
    try {
      const hs = await showOpenFilePicker({ multiple: true, types: [{ description: 'Audio', accept: { 'audio/*': AUDIO_EXT } }] });
      log('fichiers: ' + hs.length + ' reçu(s) après ' + ms());
      if (await setLibrary({ type: 'files', handles: hs }) && tracks.length) play(0);
      return;
    } catch (e) {
      log('fichiers: ' + (e && e.name) + ' après ' + ms() + ' : ' + (e && e.message));
      if (isAbort(e)) {
        if (performance.now() - t0 > 800) return;          // annulation normale par l'utilisateur
        say("Sélecteur avancé refusé : mode simple", 4000);  // fermé aussitôt : on bascule sur le mode simple
      } else { console.warn(e); say('Sélecteur avancé indisponible (' + (e && e.name) + ')', 5000); }
    }
  }
  $('fileIn').click();     // repli : sélection non mémorisée
};
$('fileIn').onchange = e => {
  log('repli input: ' + e.target.files.length + ' fichier(s)');
  const fs = [...e.target.files].filter(f => AUDIO_RE.test(f.name) || f.type.startsWith('audio/'));
  if (!fs.length) return;
  fs.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  tracks = fs.map(f => ({ name: f.name, path: '', get: async () => f }));
  idx = -1; renderList(); play(0);
  say('Sélection valable pour cette session seulement');
  e.target.value = '';
};
$('bResume').onclick = async () => {
  if (!lib) return;
  if (await loadLibrary(true)) { say('Bibliothèque rechargée'); }
  else say('Autorisation refusée');
};
(async () => {
  try { lib = await DB.get('lib'); } catch {}
  if (!lib) return;
  const first = lib;
  if ((await loadLibrary(false)) === false && lib === first) {
    $('bResume').hidden = false;
    $('bResume').textContent = '↻ ' + (lib.type === 'dir' ? lib.handle.name : lib.handles.length + ' fichiers');
  }
  syncClear();
})();

// ---- Lecteur / playlist ----
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '';
const base = n => n.replace(/\.[^.]+$/, '');
let shuffle = store.get('shuf', '0') === '1';
$('bShuf').classList.toggle('on', shuffle);

function renderList() {
  const l = $('items'); l.textContent = '';
  tracks.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'item' + (i === idx ? ' cur' : '');
    d.textContent = base(t.name); d.title = t.path + t.name;
    d.onclick = () => play(i);
    l.appendChild(d);
  });
  syncClear();
}
function markCurrent() {
  [...$('items').children].forEach((d, i) => d.classList.toggle('cur', i === idx));
  const cur = $('items').children[idx]; cur && cur.scrollIntoView({ block: 'nearest' });
}
async function play(i) {
  if (!tracks.length) return;
  await initAudio();
  idx = (i + tracks.length) % tracks.length;
  const t = tracks[idx];
  let stage = 'fichier';
  try {
    const f = await t.get();
    stopLive(); outGain.gain.value = 1; mode = 'live';
    if (curUrl) URL.revokeObjectURL(curUrl);
    curUrl = URL.createObjectURL(f);
    player.src = curUrl;
    stage = 'lecture';
    await player.play(); log('lecture: démarrée');
    $('title').textContent = base(t.name);
    markCurrent();
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: base(t.name), artist: 'Vumètre LED' });
  } catch (e) {
    console.warn(e);
    const name = e && e.name;
    log('lecture: échec (' + stage + ') ' + name + ' ' + (e && e.message));
    if (stage === 'fichier' && name === 'NotAllowedError') {
      say('Autorisation perdue : appuie sur « Reprendre »', 5000); $('bResume').hidden = false;
    } else if (stage === 'lecture' && name === 'NotAllowedError') {
      say('Lecture bloquée par le navigateur : appuie sur ▶', 5000);
    } else say('Lecture impossible (' + stage + ', ' + name + ') : ' + t.name, 5000);
  }
}
function next() {
  if (!tracks.length) return;
  if (shuffle && tracks.length > 1) { let j; do j = Math.floor(Math.random() * tracks.length); while (j === idx); play(j); }
  else play(idx + 1);
}
function prev() { if (player.currentTime > 3) player.currentTime = 0; else play(idx - 1); }
function toggle() {
  if (!tracks.length) return;
  if (idx < 0) play(0); else if (player.paused) player.play(); else player.pause();
}
$('bNext').onclick = next; $('bPrev').onclick = prev; $('bPlay').onclick = toggle;
$('bShuf').onclick = () => { shuffle = !shuffle; store.set('shuf', shuffle ? '1' : '0'); $('bShuf').classList.toggle('on', shuffle); };
$('bList').onclick = () => { $('list').classList.toggle('open'); markCurrent(); };
player.onended = next;
player.onerror = () => {
  const c = player.error && player.error.code;
  log('lecteur: erreur ' + c + ' ' + (player.error && player.error.message));
  say('Erreur du lecteur (code ' + c + ')', 5000);
};
player.onplay = () => $('bPlay').textContent = '⏸';
player.onpause = () => $('bPlay').textContent = '▶';
let seeking = false;
$('seek').oninput = () => { seeking = true; if (isFinite(player.duration)) player.currentTime = $('seek').value / 1000 * player.duration; };
$('seek').onchange = () => seeking = false;
let lastPos = 0;
player.ontimeupdate = () => {
  if (!seeking && isFinite(player.duration)) $('seek').value = player.currentTime / player.duration * 1000;
  if (idx >= 0) $('time').textContent = fmt(player.currentTime) + ' / ' + fmt(player.duration);
  if ('mediaSession' in navigator && Date.now() - lastPos > 1000 && isFinite(player.duration)) {
    lastPos = Date.now();
    try { navigator.mediaSession.setPositionState({ duration: player.duration, position: player.currentTime, playbackRate: 1 }); } catch {}
  }
};
if ('mediaSession' in navigator) {
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
  set('play', () => player.play()); set('pause', () => player.pause());
  set('nexttrack', next); set('previoustrack', prev);
  set('seekto', d => { if (d.seekTime != null) player.currentTime = d.seekTime; });
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') next(); else if (e.code === 'ArrowLeft') prev();
});

// ---- Plein écran + écran allumé ----
let reenter = false;   // vrai si un sélecteur de fichiers a fait quitter le plein écran
async function enterFull() {
  try {
    await document.documentElement.requestFullscreen();
    try { await screen.orientation.lock('landscape'); } catch {}
  } catch (e) { console.warn(e); }
}
$('bFull').onclick = async () => {
  reenter = false;
  if (!document.fullscreenElement) await enterFull();
  else { try { await document.exitFullscreen(); screen.orientation.unlock(); } catch {} }
};
// Après le sélecteur de fichiers, le prochain appui sur l'écran remet le plein écran
addEventListener('pointerup', () => {
  if (reenter && !document.fullscreenElement) { reenter = false; enterFull(); }
}, { passive: true });
// Le bouton ⛶ n'a de sens que dans un onglet de navigateur : l'app installée est déjà en plein écran,
// et l'API n'existe pas sur iPhone
const installedApp = ['fullscreen', 'standalone', 'minimal-ui'].some(m => matchMedia('(display-mode: ' + m + ')').matches) || navigator.standalone === true;
if (installedApp || !document.documentElement.requestFullscreen) $('bFull').hidden = true;
let wl = null;
async function lockScreen() {
  try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.onrelease = () => wl = null; } } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lockScreen(); });
addEventListener('pointerdown', lockScreen, { once: true });
lockScreen();

// ---- Écran de diagnostic (bouton ℹ) : touche le texte pour le copier ----
function infoText() {
  const dm = matchMedia('(display-mode: fullscreen)').matches ? 'fullscreen'
    : matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'navigateur';
  return ['version ' + VERSION,
    'affichage: ' + dm + ' · sécurisé: ' + isSecureContext,
    'API dossier: ' + ('showDirectoryPicker' in window) + ' · API fichiers: ' + ('showOpenFilePicker' in window),
    'service worker: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'actif' : 'aucun'),
    'audio: ' + (actx ? actx.state : 'non créé') + ' · source: ' + mode,
    'pistes: ' + tracks.length + ' · index: ' + idx + ' · bibliothèque: ' + (lib ? lib.type : 'aucune'),
    'lecteur: ready=' + player.readyState + ' paused=' + player.paused + ' erreur=' + (player.error ? player.error.code : '-'),
    'écran: ' + innerWidth + 'x' + innerHeight + ' @' + devicePixelRatio,
    navigator.userAgent,
    '--- journal ---', ...LOG].join('\n');
}
$('bInfo').onclick = () => { $('info').textContent = infoText(); $('infoBox').hidden = false; };
$('infoClose').onclick = () => { $('infoBox').hidden = true; };
$('infoCopy').onclick = () => { try { navigator.clipboard.writeText($('info').textContent); say('Copié'); } catch {} };

// ---- Panneau de réglages (⚙) : s'ouvre et se ferme uniquement sur action (⚙, ou toucher en dehors du panneau) ----
const settings = $('settings');
function closeSettings() { settings.hidden = true; document.body.classList.remove('setopen'); }
$('bSet').onclick = () => {
  if (settings.hidden) { settings.hidden = false; document.body.classList.add('setopen'); }
  else closeSettings();
};
addEventListener('pointerdown', e => {
  if (!settings.hidden && !settings.contains(e.target) && !e.target.closest('#bSet')) closeSettings();
});
$('bReset').onclick = () => { resetBri(); resetSens(); say('Réglages par défaut'); };
['bMic', 'bSys', 'bInfo'].forEach(id => $(id).addEventListener('click', closeSettings));
log('démarrage v' + VERSION);

// ---- Détection de mise à jour : compare la version en ligne à celle qui tourne ----
async function checkUpdate() {
  try {
    const r = await fetch('index.html?nocache=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const VERSION = '([^']+)'/);
    if (m && m[1] !== VERSION) {
      $('bUpdate').hidden = false;
      $('bUpdate').textContent = '⟳ Mettre à jour';
      say('Mise à jour disponible', 6000); log('mise à jour disponible: ' + m[1]);
    }
  } catch (e) { log('vérification de mise à jour impossible'); }
}
$('bUpdate').onclick = async () => {
  try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch {}
  location.reload();
};
setTimeout(checkUpdate, 3000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(console.warn);
</script>
